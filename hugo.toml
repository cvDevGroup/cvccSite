baseURL = 'https://chippewavalleycodecamp.com/'
languageCode = 'en-us'
title = 'Chippewa Valley Code Camp'

theme='codeCamp'

sectionPagesMenu = 'main'

# Promo_kit is a leaf bundle (index.md instead of _index.md) so the sectionPagesMenu does not automatically pick it up.
[[menus.main]]
name = 'Promo Kit'
url = '/promo_kit/'
weight = 17

# Speakers is a taxonomy (see [taxonomies] below), not a section, so sectionPagesMenu doesn't add it.
[[menus.main]]
name = 'Speakers'
pageRef = '/speakers'

[[menus.footer]]
name = 'Tags'
pageRef = '/tags'
weight = 30

# Speakers are a taxonomy: each session lists its presenters in front matter, e.g.
#   speakers = ["coryL", "bpHogan"]
# and Hugo links each speaker page (content/speakers/<name>/_index.md) to their sessions.
# Defining [taxonomies] replaces Hugo's defaults, so 'tags' must stay listed here.
[taxonomies]
  tag = 'tags'
  speaker = 'speakers'

[markup.goldmark.renderer]
  unsafe = true # Allow HTML in md files

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

[params]
  # Site-wide announcement banner (appears on all pages unless hideAnnouncement = true in page front matter)
  showAnnouncement = false  # Set to false to hide the banner site-wide without deleting the text below
  # Optional schedule (YYYY-MM-DD, inclusive). The banner only shows between these dates.
  # announcementStartDate = '2026-01-15'
  announcementEndDate = '2026-03-14'  # 2026 event day; the banner won't come back even if showAnnouncement is set to true
  announcement = '2026 Registration is Now Open!'
  announcementLink = 'https://www.eventbrite.com/e/chippewa-valley-code-camp-2026-tickets-1980783904981'
  announcementButtonText = 'Register on Eventbrite'
  announcementConfetti = true  # Set to false to disable confetti animation

  # The year of the upcoming Code Camp. Update this once per year when rolling the site over.
  # Used for the Sessions/Presenters headings, to filter which speakers and sessions are "current",
  # and available in content via the {{< campYear >}} shortcode.
  campYear = 2027
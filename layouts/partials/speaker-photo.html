{{/* Speaker photo block — expects a speaker page object as context.
     Renders: stacked circles (images array), single circle (image), or placeholder. */}}
{{ if and .Params.images (gt (len .Params.images) 1) }}
<div class="speaker-card-photo-stack">
  {{ range .Params.images }}
  <img src="{{ . }}" alt="" class="speaker-card-photo-stacked">
  {{ end }}
</div>
{{ else if .Params.image }}
<img src="{{ .Params.image }}" alt="{{ .Title }}" class="speaker-card-photo">
{{ else }}
<div class="speaker-card-no-photo">
  <img src="/img/2023/CVCC_round_01.png" alt="">
</div>
{{ end }}
